<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Pavan Yadav</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f3ec;
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6rem;
      font-weight: 700;
      color: #c9a96a;
      line-height: 1;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2rem;
      margin-top: 1rem;
      font-weight: 600;
    }
    p {
      color: #78716c;
      margin-top: 0.75rem;
      font-size: 1rem;
    }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.75rem;
      background: #1c1917;
      color: #f7f5f0;
      text-decoration: none;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #292524; }
    @media (prefers-color-scheme: dark) {
      body { background: #141210; color: #ede9e3; }
      p { color: #a8a29e; }
      a { background: #ede9e3; color: #141210; }
      a:hover { background: #d6d3d1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/portfolio/">Back to portfolio</a>
  </div>
</body>
</html>
